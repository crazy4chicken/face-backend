[project]
name = "face-backend"
version = "2.0.0"
description = "人脸识别后端：FastAPI + InsightFace + PostgreSQL + teamusers 鉴权"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "teamusers-sdk>=0.2.0",
]

[dependency-groups]
dev = [
    "requests>=2.32",
]
